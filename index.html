<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raportano Live Score</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { color-scheme: light dark; }

        @media (prefers-color-scheme: light) {
            body { background: #fffbfe; color: #1c1b1f; }
            :root {
                --primary: #7d5260;
                --on-primary: #ffffff;
                --surface: #fffbfe;
                --surface-container: #f7f2f6;
                --outline: #79747e;
            }
        }

        @media (prefers-color-scheme: dark) {
            body { background: #1c1b1f; color: #e6e1e5; }
            :root {
                --primary: #eaddff;
                --on-primary: #432874;
                --surface: #1c1b1f;
                --surface-container: #2f2d32;
                --outline: #9e9da0;
            }
        }

        body { font-family: 'Roboto', sans-serif; }
        .app-container { display: flex; flex-direction: column; height: 100vh; }
        header { padding: 1rem; text-align: center; border-bottom: 1px solid var(--outline); background: var(--surface-container); }
        header h1 { font-size: 1.5rem; font-weight: 700; }

        .navbar { display: flex; gap: 0.5rem; padding: 1rem; border-bottom: 1px solid var(--outline); overflow-x: auto; background: var(--surface-container); }
        .nav-btn { padding: 0.75rem 1rem; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap; background: transparent; }
        .nav-btn.active { background: var(--primary); color: var(--on-primary); }

        .content { flex: 1; overflow-y: auto; padding: 1.5rem; max-width: 1200px; margin: 0 auto; width: 100%; }
        .screen { display: none; }
        .screen.active { display: block; }

        .card { background: var(--surface-container); border: 1px solid var(--outline); border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
        .card h2 { font-size: 1.25rem; margin-bottom: 1rem; color: var(--primary); }

        .news-item { background: var(--surface); border: 1px solid var(--outline); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
        .news-item h3 { margin-bottom: 0.5rem; }
        .news-item p { opacity: 0.7; font-size: 0.9rem; }

        .match-card { 
            background: var(--surface); 
            border: 2px solid var(--outline); 
            border-radius: 8px; 
            padding: 1.5rem; 
            margin-bottom: 1rem; 
            cursor: pointer;
            transition: all 0.3s;
        }
        .match-card:hover { border-color: var(--primary); background: var(--surface-container); }
        .match-card.live { border-color: #ff6b6b; }

        .match-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .match-date { opacity: 0.7; font-size: 0.9rem; }
        .match-status { padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        .match-status.live { background: #ff6b6b; color: white; }
        .match-status.completed { background: var(--primary); color: var(--on-primary); }

        .match-score { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1rem; align-items: center; }
        .team-name { font-weight: 600; }
        .score-display { font-size: 2rem; font-weight: 700; text-align: center; }

        .match-details { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--outline); }
        .detail-row { display: flex; justify-content: space-between; padding: 0.5rem 0; font-size: 0.9rem; }

        .staff-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 1rem; }
        .staff-card { background: var(--surface); border: 1px solid var(--outline); border-radius: 8px; padding: 1.5rem; text-align: center; }
        .staff-role { opacity: 0.7; font-size: 0.9rem; margin-bottom: 0.5rem; }
        .staff-name { font-size: 1.1rem; font-weight: 600; }

        .btn { padding: 0.75rem 1.5rem; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; background: var(--primary); color: var(--on-primary); }
        .btn:hover { opacity: 0.9; }

        @media (max-width: 768px) {
            .navbar { gap: 0.25rem; }
            .nav-btn { padding: 0.5rem 0.75rem; font-size: 0.85rem; }
            .content { padding: 1rem; }
        }

        .loading { text-align: center; opacity: 0.7; padding: 2rem; }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>⚽ Raportano Live Score</h1>
        </header>

        <nav class="navbar">
            <button class="nav-btn active" onclick="switchScreen('home', this)">🏠 Home</button>
            <button class="nav-btn" onclick="switchScreen('partite', this)">⚽ Partite</button>
            <button class="nav-btn" onclick="switchScreen('staff', this)">👥 Staff</button>
            <button class="nav-btn" onclick="switchScreen('regolamento', this)">📄 Regolamento</button>
        </nav>

        <div class="content">
            <!-- HOME -->
            <div id="home" class="screen active">
                <div class="card">
                    <h2>📰 Notizie</h2>
                    <div id="newsList">
                        <p class="loading">Caricamento notizie...</p>
                    </div>
                </div>

                <div class="card">
                    <h2>⚽ Prossime Partite</h2>
                    <div id="upcomingMatches">
                        <p class="loading">Caricamento partite...</p>
                    </div>
                </div>
            </div>

            <!-- PARTITE -->
            <div id="partite" class="screen">
                <div class="card">
                    <h2>📅 Tutte le Partite</h2>
                    <div id="allMatches">
                        <p class="loading">Caricamento partite...</p>
                    </div>
                </div>
            </div>

            <!-- STAFF -->
            <div id="staff" class="screen">
                <div class="card">
                    <h2>👥 Staff</h2>
                    <div class="staff-grid" id="staffList">
                        <p class="loading">Caricamento staff...</p>
                    </div>
                </div>
            </div>

            <!-- REGOLAMENTO -->
            <div id="regolamento" class="screen">
                <div class="card">
                    <h2>📄 Regolamento</h2>
                    <p style="margin-bottom: 1rem;">Scarica il regolamento completo della competizione.</p>
                    <button class="btn" onclick="downloadPDF()">📥 Scarica Regolamento PDF</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://nvkpmmktfzhepswkwctb.supabase.co";
        const SUPABASE_KEY = "sb_publishable_VlZNFZJSHCTqqa7h0939bQ_X5CLfyLF";

        let matches = [];
        let news = [];
        let teams = [];
        let staff = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            // Ricarica ogni 5 secondi per punteggi LIVE
            setInterval(loadData, 5000);
        });

        async function loadData() {
            await loadTeams();
            await loadMatches();
            await loadNews();
            await loadStaff();
        }

        function switchScreen(screenName, button) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(screenName).classList.add('active');
            if (button) button.classList.add('active');
        }

        async function apiCall(table) {
            try {
                const url = `${SUPABASE_URL}/rest/v1/${table}`;
                const response = await fetch(url, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                if (!response.ok) throw new Error('API Error');
                return await response.json();
            } catch (err) {
                return null;
            }
        }

        async function loadTeams() {
            const result = await apiCall('teams');
            if (result) teams = result;
        }

        async function loadMatches() {
            const result = await apiCall('matches?order=date.desc');
            if (result) {
                matches = result;
                updateMatchesDisplay();
                updateUpcomingMatches();
            }
        }

        function updateMatchesDisplay() {
            const div = document.getElementById('allMatches');
            if (!matches.length) {
                div.innerHTML = '<p style="opacity: 0.7; text-align: center;">Nessuna partita</p>';
                return;
            }

            div.innerHTML = matches.map(m => {
                const t1 = teams.find(t => t.id === m.team1_id)?.name || 'Squad1';
                const t2 = teams.find(t => t.id === m.team2_id)?.name || 'Squad2';
                const isLive = m.status === 'live';

                return `
                    <div class="match-card ${isLive ? 'live' : ''}">
                        <div class="match-header">
                            <div class="match-date">${formatDate(m.date)}</div>
                            <div class="match-status ${m.status}">${getStatusLabel(m.status)}</div>
                        </div>
                        <div class="match-score">
                            <div class="team-name">${t1}</div>
                            <div class="score-display">${m.score1 || 0} - ${m.score2 || 0}</div>
                            <div class="team-name" style="text-align: right;">${t2}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateUpcomingMatches() {
            const div = document.getElementById('upcomingMatches');
            const upcoming = matches.slice(0, 3);
            
            if (!upcoming.length) {
                div.innerHTML = '<p style="opacity: 0.7; text-align: center;">Nessuna partita programmata</p>';
                return;
            }

            div.innerHTML = upcoming.map(m => {
                const t1 = teams.find(t => t.id === m.team1_id)?.name || 'Squad1';
                const t2 = teams.find(t => t.id === m.team2_id)?.name || 'Squad2';

                return `
                    <div class="match-card">
                        <div class="match-header">
                            <div class="match-date">${formatDate(m.date)}</div>
                            <div class="match-status ${m.status}">${getStatusLabel(m.status)}</div>
                        </div>
                        <div class="match-score">
                            <div class="team-name">${t1}</div>
                            <div class="score-display">${m.score1 || 0} - ${m.score2 || 0}</div>
                            <div class="team-name" style="text-align: right;">${t2}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function loadNews() {
            const result = await apiCall('news?order=created_at.desc');
            if (result) {
                news = result;
                updateNewsList();
            }
        }

        function updateNewsList() {
            const div = document.getElementById('newsList');
            if (!news.length) {
                div.innerHTML = '<p style="opacity: 0.7; text-align: center;">Nessuna notizia</p>';
                return;
            }

            div.innerHTML = news.map(n => `
                <div class="news-item">
                    <h3>${n.title}</h3>
                    <p>${n.text}</p>
                </div>
            `).join('');
        }

        async function loadStaff() {
            const result = await apiCall('staff');
            if (result) {
                staff = result;
                updateStaffDisplay();
            }
        }

        function updateStaffDisplay() {
            const div = document.getElementById('staffList');
            
            if (!staff.length) {
                div.innerHTML = '<p style="opacity: 0.7; text-align: center;">Staff non disponibile</p>';
                return;
            }

            div.innerHTML = staff.map(m => `
                <div class="staff-card">
                    <div class="staff-role">${m.role}</div>
                    <div class="staff-name">${m.name || '-'}</div>
                </div>
            `).join('');
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            return date.toLocaleDateString('it-IT', options);
        }

        function getStatusLabel(status) {
            const labels = {
                'scheduled': '⏰ Programmata',
                'live': '🔴 LIVE',
                'completed': '✅ Conclusa'
            };
            return labels[status] || 'N/A';
        }

        function downloadPDF() {
            const url = `${SUPABASE_URL}/storage/v1/object/public/regolamento/regolamento.pdf`;
            const link = document.createElement('a');
            link.href = url;
            link.download = 'regolamento.pdf';
            link.click();
        }
    </script>
</body>
</html>
